name: Pull Request
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        uses: infrablocks/github-actions/asdf_install@v1
      - name: Check
        run: ./go test:code:check
      - name: Notify Slack
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./go "slack:notify[${{ job.status }}]"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialise real AWS applies repo-wide: shared with main.yaml's test job,
    # replacing CircleCI's eddiewebb/queue orb. queue: max = strict FIFO (see
    # the family plan, D8).
    # 'queue: max' — GA 2026-05-07: https://github.blog/changelog/2026-05-07-github-actions-concurrency-groups-now-allow-larger-queues/
    concurrency:
      group: aws-integration
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        uses: infrablocks/github-actions/asdf_install@v1
      - name: Install secrets tools
        run: sudo apt-get update && sudo apt-get install -y git-crypt gnupg
      - name: Debug tree state (temporary)
        run: |
          gem install --no-document bundler
          bundle install
          bundler -v
          git status --porcelain
          git --no-pager diff | head -120
      - name: Unlock git-crypt
        run: ./go git_crypt:unlock_with_encrypted_gpg_key
        env:
          ENCRYPTION_PASSPHRASE: ${{ secrets.ENCRYPTION_PASSPHRASE }}
      - name: Test
        run: |
          source config/secrets/ci/aws-credentials.sh
          ./go test:unit
          ./go test:integration
      - name: Notify Slack
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./go "slack:notify[${{ job.status }}]"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  merge-pull-request:
    needs: [check, test]
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge pull request
        run: gh pr merge --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
